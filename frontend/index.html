<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wayly / the-goat — Lab 0</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.5;
      }
      body {
        margin: 0;
        background: #f6f1e8;
        color: #1f1b16;
      }
      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 4rem;
      }
      p.kicker {
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: #6b5e4e;
        margin-bottom: 0.4rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      .card {
        background: #fffdf8;
        border: 1px solid #d9cbb8;
        border-radius: 12px;
        padding: 1.25rem 1.35rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #1f1b16;
        color: #fffdf8;
        padding: 0.65rem 1.1rem;
        cursor: pointer;
        font-size: 1rem;
      }
      button:focus-visible {
        outline: 3px solid #c4a574;
        outline-offset: 2px;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f3ece1;
        border-radius: 8px;
        padding: 0.9rem 1rem;
        min-height: 6rem;
      }
      .status {
        margin: 0.75rem 0 0;
        color: #6b5e4e;
      }
      .error {
        color: #8a2a21;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">SYSEN 5151 · Lab 0 readiness check</p>
      <h1>Wayly / 途鉴</h1>
      <p>
        This page calls the course API and renders a hard-coded New York itinerary
        placeholder. It is not live planning.
      </p>
      <section class="card">
        <p>
          <button id="load-itinerary" type="button">Load hard-coded itinerary</button>
        </p>
        <p id="status" class="status">Waiting for the API response.</p>
        <pre id="result" aria-live="polite"></pre>
      </section>
    </main>
    <script>
      const statusEl = document.getElementById("status");
      const resultEl = document.getElementById("result");
      const buttonEl = document.getElementById("load-itinerary");
      const apiUrl =
        window.location.protocol === "file:"
          ? "http://127.0.0.1:8000/api/itinerary"
          : "/api/itinerary";

      async function loadItinerary() {
        statusEl.classList.remove("error");
        statusEl.textContent = "Calling " + apiUrl + " …";
        resultEl.textContent = "";
        try {
          const response = await fetch(apiUrl);
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          const data = await response.json();
          statusEl.textContent = "API response received.";
          resultEl.textContent =
            data.message +
            "\n\n" +
            JSON.stringify(data, null, 2);
        } catch (error) {
          statusEl.classList.add("error");
          statusEl.textContent =
            "Could not reach the API. Start it with: python backend/app.py";
          resultEl.textContent = String(error);
        }
      }

      buttonEl.addEventListener("click", loadItinerary);
      loadItinerary();
    </script>
  </body>
</html>
